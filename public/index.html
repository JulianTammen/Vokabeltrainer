<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spanisch</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spanisch">
<meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A24" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap">
<style>
/* ------------------------------------------------------------------ */
/* Farben: Tinte, Papier, Celeste (Fahne), Sol de Mayo (Gold)          */
/* ------------------------------------------------------------------ */
:root {
  --paper:   #FBF8F3;
  --raised:  #FFFFFF;
  --ink:     #12202E;
  --muted:   #62748A;
  --line:    #E4DED3;
  --celeste: #2F7CB0;
  --celeste-soft: #E3EFF7;
  --sol:     #C8871E;
  --sol-soft:#FBF0DA;
  --good:    #2E7D5B;
  --again:   #B4472F;
  --shadow:  0 1px 2px rgba(18,32,46,.06), 0 8px 24px rgba(18,32,46,.05);
  --tap: rgba(47,124,176,.09);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:   #0F1A24;
    --raised:  #17242F;
    --ink:     #E9EEF3;
    --muted:   #94A6B6;
    --line:    #263644;
    --celeste: #7CBBE4;
    --celeste-soft: #17303F;
    --sol:     #E8B45C;
    --sol-soft:#2C2413;
    --good:    #6BC49A;
    --again:   #E88B72;
    --shadow:  0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --tap: rgba(124,187,228,.12);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Archivo, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 17px;
  line-height: 1.6;
  overscroll-behavior-y: none;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--celeste); text-decoration-thickness: 1px; text-underline-offset: 2px; }

/* ------------------------------------------------------------------ */
/* Kopfzeile                                                           */
/* ------------------------------------------------------------------ */
header {
  position: sticky; top: 0; z-index: 20;
  padding: max(env(safe-area-inset-top), 10px) 18px 12px;
  background: color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
header.scrolled { border-bottom-color: var(--line); }
.bar { display: flex; align-items: center; gap: 10px; min-height: 34px; }

#back {
  display: none; align-items: center; gap: 3px;
  margin-left: -6px; padding: 4px 6px;
  color: var(--celeste); font-size: 15px; font-weight: 500;
  border-radius: 8px;
}
#back.on { display: inline-flex; }
#back svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

h1 {
  flex: 1; min-width: 0; margin: 0;
  font-family: Fraunces, Georgia, serif;
  font-optical-sizing: auto;
  font-size: 25px; font-weight: 600; letter-spacing: -.015em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#sync {
  flex: none; width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 50%; color: var(--muted);
}
#sync svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
#sync.busy { color: var(--celeste); }
#sync.busy svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------ */
/* Grundlayout                                                         */
/* ------------------------------------------------------------------ */
main {
  padding: 4px 18px calc(84px + env(safe-area-inset-bottom));
  max-width: 720px; margin: 0 auto;
}
.view { display: none; }
.view.on { display: block; animation: rise .22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------------ */
/* Tab-Leiste                                                          */
/* ------------------------------------------------------------------ */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line);
}
nav button {
  flex: 1; padding: 5px 0 3px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .015em;
  transition: color .15s;
}
nav button svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--celeste); }
nav button[aria-selected="true"] svg { stroke-width: 2.1; }

/* ------------------------------------------------------------------ */
/* Notion-Inhalte                                                      */
/* ------------------------------------------------------------------ */
.doc h2, .doc h3, .doc h4 {
  font-family: Fraunces, Georgia, serif;
  font-optical-sizing: auto;
  letter-spacing: -.01em; line-height: 1.25;
  margin: 30px 0 10px;
}
.doc h2 { font-size: 22px; font-weight: 600; }
.doc h3 { font-size: 19px; font-weight: 600; }
.doc h4 { font-size: 17px; font-weight: 600; color: var(--muted); }
.doc > *:first-child { margin-top: 8px; }
.doc p { margin: 0 0 12px; }
.doc ul, .doc ol { margin: 0 0 14px; padding-left: 22px; }
.doc li { margin-bottom: 6px; }
.doc li::marker { color: var(--celeste); }
.doc strong { font-weight: 600; }
.doc code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .87em; padding: 1px 5px; border-radius: 5px;
  background: var(--celeste-soft); color: var(--celeste);
}
.doc pre {
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px; overflow-x: auto; font-size: 14px;
}
.doc pre code { background: none; color: inherit; padding: 0; }
.doc blockquote {
  margin: 0 0 14px; padding: 2px 0 2px 15px;
  border-left: 2.5px solid var(--sol); color: var(--muted);
}
.doc hr { margin: 26px 0; border: 0; border-top: 1px solid var(--line); }
.doc figure { margin: 0 0 16px; }
.doc img { width: 100%; border-radius: 12px; }
.doc figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
.doc details {
  border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 15px; margin-bottom: 12px; background: var(--raised);
}
.doc summary { cursor: pointer; font-weight: 500; }
.doc .toggle-body { margin-top: 10px; }
.doc .todo.done { color: var(--muted); text-decoration: line-through; }

.callout {
  display: flex; gap: 11px;
  background: var(--sol-soft); border-radius: 13px;
  padding: 13px 15px; margin: 0 0 14px;
}
.callout > div > *:last-child { margin-bottom: 0; }
.callout-icon { flex: none; font-size: 18px; line-height: 1.5; }

.table-wrap { overflow-x: auto; margin: 0 0 16px; -webkit-overflow-scrolling: touch; }
.doc table { border-collapse: collapse; width: 100%; font-size: 15px; }
.doc th, .doc td {
  border: 1px solid var(--line); padding: 8px 11px;
  text-align: left; vertical-align: top;
}
.doc th { background: var(--celeste-soft); font-weight: 600; white-space: nowrap; }

.nc-gray{color:var(--muted)} .nc-brown{color:#8B6A4F} .nc-orange{color:#C2761F}
.nc-yellow{color:var(--sol)} .nc-green{color:var(--good)} .nc-blue{color:var(--celeste)}
.nc-purple{color:#8267C4} .nc-pink{color:#C25890} .nc-red{color:var(--again)}
[class*="-background"] { padding: 1px 4px; border-radius: 4px; background: var(--celeste-soft); color: inherit; }

/* ------------------------------------------------------------------ */
/* Navigationskarten                                                   */
/* ------------------------------------------------------------------ */
.nav-card {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 15px 16px; margin-bottom: 8px;
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 14px; text-align: left;
  font-size: 17px; font-weight: 500;
  transition: transform .12s, background .12s;
}
.nav-card:active { transform: scale(.985); background: var(--tap); }
.nav-card span { flex: 1; }
.nav-card svg {
  flex: none; width: 17px; height: 17px; color: var(--muted);
  fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
}

/* ------------------------------------------------------------------ */
/* Vokabelliste                                                        */
/* ------------------------------------------------------------------ */
.search {
  display: flex; align-items: center; gap: 9px;
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 12px; padding: 0 13px; margin: 10px 0 12px;
}
.search svg { width: 17px; height: 17px; flex: none; color: var(--muted); fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.search input {
  flex: 1; border: 0; outline: 0; background: none; color: inherit;
  font: inherit; font-size: 16px; padding: 11px 0;
}

.chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 12px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 6px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--raised);
  font-size: 14px; font-weight: 500; color: var(--muted);
  transition: all .13s; white-space: nowrap;
}
.chip[aria-pressed="true"] {
  background: var(--celeste); border-color: var(--celeste);
  color: #fff;
}

.vocab-row {
  display: flex; align-items: baseline; gap: 12px;
  padding: 12px 2px; border-bottom: 1px solid var(--line);
}
.vocab-row .es {
  font-family: Fraunces, Georgia, serif; font-optical-sizing: auto;
  font-size: 18px; font-weight: 600; letter-spacing: -.005em;
}
.vocab-row .de { flex: 1; color: var(--muted); font-size: 15.5px; text-align: right; }
.vocab-row .irr { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--sol); align-self: center; }
.vocab-ex { font-size: 14.5px; color: var(--muted); font-style: italic; padding: 0 2px 12px; margin-top: -6px; border-bottom: 1px solid var(--line); }

.count { font-size: 14px; color: var(--muted); padding: 4px 2px 8px; }

/* ------------------------------------------------------------------ */
/* Trainer — das Herzstueck                                            */
/* ------------------------------------------------------------------ */
.setup { padding-top: 6px; }
.setup h2 {
  font-family: Fraunces, Georgia, serif; font-optical-sizing: auto;
  font-size: 20px; font-weight: 600; margin: 22px 0 10px;
}
.setup h2:first-child { margin-top: 10px; }

.seg { display: flex; gap: 4px; background: var(--celeste-soft); border-radius: 12px; padding: 4px; }
.seg button {
  flex: 1; padding: 9px 0; border-radius: 9px;
  font-size: 15px; font-weight: 500; color: var(--muted);
  transition: all .15s;
}
.seg button[aria-selected="true"] { background: var(--raised); color: var(--ink); box-shadow: var(--shadow); }

.start {
  width: 100%; margin-top: 28px; padding: 16px;
  background: var(--celeste); color: #fff;
  border-radius: 14px; font-size: 17px; font-weight: 600;
  transition: transform .12s, opacity .12s;
}
.start:active { transform: scale(.985); }
.start:disabled { opacity: .4; }

.progress { display: flex; align-items: center; gap: 12px; padding: 12px 0 18px; }
.track { flex: 1; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.fill { height: 100%; background: var(--celeste); border-radius: 99px; transition: width .3s cubic-bezier(.4,0,.2,1); }
.progress .n { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Die Karte: Enthuellung durch Farbwechsel + Aufsteigen der Antwort.
   Bewusst kein 3D-Flip — der ruckelt in iOS-Safari. */
.card {
  position: relative; width: 100%;
  min-height: 300px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; padding: 34px 26px;
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 22px; box-shadow: var(--shadow);
  text-align: center; overflow: hidden;
  transition: background-color .34s ease, border-color .34s ease;
}
.card.open { background: var(--celeste-soft); border-color: transparent; }

.card .tag {
  position: absolute; top: 16px; left: 0; right: 0;
  font-size: 11.5px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted);
}
.card .sun {
  position: absolute; top: 14px; right: 16px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--sol);
  opacity: 0; transition: opacity .3s;
}
.card.irr .sun { opacity: 1; }

.card .front {
  font-family: Fraunces, Georgia, serif; font-optical-sizing: auto;
  font-size: 34px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em;
  transition: transform .34s cubic-bezier(.32,.72,0,1);
}
.card.open .front { transform: translateY(-8px); }

.card .back {
  font-size: 21px; font-weight: 500; color: var(--celeste);
  opacity: 0; transform: translateY(14px);
  transition: opacity .3s ease .06s, transform .34s cubic-bezier(.32,.72,0,1) .06s;
}
.card.open .back { opacity: 1; transform: none; }

.card .ex {
  margin-top: 10px; font-size: 15px; font-style: italic; color: var(--muted);
  opacity: 0; transition: opacity .3s ease .14s;
}
.card.open .ex { opacity: 1; }

.card .hint {
  position: absolute; bottom: 18px; left: 0; right: 0;
  font-size: 13px; color: var(--muted); opacity: .75;
  transition: opacity .2s;
}
.card.open .hint { opacity: 0; }

.answers { display: flex; gap: 10px; margin-top: 16px; opacity: 0; pointer-events: none; transition: opacity .22s; }
.answers.on { opacity: 1; pointer-events: auto; }
.answers button {
  flex: 1; padding: 15px; border-radius: 14px;
  font-size: 16px; font-weight: 600; border: 1.5px solid;
  transition: transform .12s;
}
.answers button:active { transform: scale(.97); }
.ag { color: var(--again); border-color: var(--again); }
.ok { color: #fff; background: var(--good); border-color: var(--good); }

.done-panel { text-align: center; padding: 50px 20px; }
.done-panel .sol {
  font-family: Fraunces, Georgia, serif; font-optical-sizing: auto;
  font-size: 46px; font-weight: 700; color: var(--sol); letter-spacing: -.02em;
}
.done-panel p { color: var(--muted); margin: 8px 0 26px; }

/* ------------------------------------------------------------------ */
/* Zustaende                                                           */
/* ------------------------------------------------------------------ */
.state { text-align: center; padding: 70px 24px; color: var(--muted); }
.state.err { color: var(--again); }
.state code { font-family: ui-monospace, monospace; font-size: 13px; }
.skeleton { height: 58px; border-radius: 14px; background: var(--line); opacity: .45; margin-bottom: 8px; animation: pulse 1.4s ease-in-out infinite; }
.skeleton:nth-child(2) { animation-delay: .1s; }
.skeleton:nth-child(3) { animation-delay: .2s; }
@keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: .6; } }

.stamp { text-align: center; font-size: 12.5px; color: var(--muted); padding: 26px 0 6px; opacity: .7; }

:focus-visible { outline: 2px solid var(--celeste); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <button id="back" aria-label="Zurück">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      <span id="back-label">Zurück</span>
    </button>
    <h1 id="title">Spanisch</h1>
    <button id="sync" aria-label="Inhalte aus Notion aktualisieren">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<main>
  <section id="v-grammatik" class="view on"></section>
  <section id="v-vokabeln" class="view"></section>
  <section id="v-trainer" class="view"></section>
</main>

<nav role="tablist">
  <button data-tab="grammatik" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    Grammatik
  </button>
  <button data-tab="vokabeln" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h12"/></svg>
    Vokabeln
  </button>
  <button data-tab="trainer" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
    Üben
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
