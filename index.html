{ar:"genial",de:"genial; toll",art:"Adjektiv",irr:false,ex:null},
{ar:"el celular",de:"Handy",art:"Substantiv",irr:false,ex:null},
{ar:"laburar",de:"arbeiten (Slang für 'trabajar')",art:"Verb",irr:false,ex:null},
{ar:"obvio",de:"klar; logisch",art:"Redewendung",irr:false,ex:null},
{ar:"contar",de:"erzählen",art:"Verb",irr:true,ex:null},
];

const WORTARTEN = ["Substantiv","Verb","Adjektiv","Präposition","Adverb","Konjunktion","Redewendung"];

const ART_COLORS = {
  Substantiv: "#C4472A",
  Verb: "#2E6E8E",
  Adjektiv: "#3F7D4F",
  Präposition: "#B8952E",
  Adverb: "#8B5FA8",
  Konjunktion: "#5C6B73",
  Redewendung: "#B8562E",
};

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const FLIP_MS = 450;

function App() {
  const [direction, setDirection] = useState("ar2de");
  const [selectedArten, setSelectedArten] = useState(new Set(WORTARTEN));
  const [randomized, setRandomized] = useState(true);
  const [showSettings, setShowSettings] = useState(true);
  const [queue, setQueue] = useState([]);
  const [totalCards, setTotalCards] = useState(0);
  const [masteredIds, setMasteredIds] = useState(new Set());
  const [wrongAttempts, setWrongAttempts] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [isAnimating, setIsAnimating] = useState(false);
  const [sessionStarted, setSessionStarted] = useState(false);

  const filteredBase = useMemo(
    () => RAW_VOCAB.map((v, i) => ({ ...v, id: i })).filter((v) => selectedArten.has(v.art)),
    [selectedArten]
  );

  const startSession = useCallback(() => {
    const base = randomized ? shuffleArr(filteredBase) : filteredBase;
    setQueue(base);
    setTotalCards(base.length);
    setMasteredIds(new Set());
    setWrongAttempts(0);
    setFlipped(false);
    setIsAnimating(false);
    setSessionStarted(true);
    setShowSettings(false);
  }, [filteredBase, randomized]);

  const toggleArt = (art) => {
    setSelectedArten((prev) => {
      const next = new Set(prev);
      if (next.has(art)) next.delete(art); else next.add(art);
      return next;
    });
  };

  const current = queue[0];
  const front = current ? (direction === "ar2de" ? current.ar : current.de) : "";
  const back = current ? (direction === "ar2de" ? current.de : current.ar) : "";

  const advance = useCallback((mutateQueue) => {
    if (isAnimating) return;
    if (flipped) {
      setIsAnimating(true);
      setFlipped(false);
      setTimeout(() => { mutateQueue(); setIsAnimating(false); }, FLIP_MS);
    } else {
      mutateQueue();
    }
  }, [flipped, isAnimating]);

  const skip = useCallback(() => {
    if (!current) return;
    advance(() => setQueue((q) => [...q.slice(1), q[0]]));
  }, [advance, current]);

  const markKnown = (val) => {
    if (!current) return;
    if (val) {
      advance(() => {
        setMasteredIds((prev) => new Set(prev).add(current.id));
        setQueue((q) => q.slice(1));
      });
    } else {
      setWrongAttempts((c) => c + 1);
      advance(() => setQueue((q) => [...q.slice(1), q[0]]));
    }
  };

  useEffect(() => {
    if (!sessionStarted) return;
    const handler = (e) => {
      if (e.code === "Space") { e.preventDefault(); if (!isAnimating) setFlipped((f) => !f); }
      else if (e.code === "ArrowRight") { skip(); }
      else if (e.code === "Digit1" || e.key === "1") { markKnown(false); }
      else if (e.code === "Digit2" || e.key === "2") { markKnown(true); }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [sessionStarted, isAnimating, skip, current]);

  const knownCount = masteredIds.size;
  const progress = totalCards ? (knownCount / totalCards) * 100 : 0;
  const roundComplete = sessionStarted && queue.length === 0;

  const restart = () => {
    const base = randomized ? shuffleArr(filteredBase) : filteredBase;
    setQueue(base);
    setTotalCards(base.length);
    setMasteredIds(new Set());
    setWrongAttempts(0);
    setFlipped(false);
    setIsAnimating(false);
  };

  return (
    <div style={styles.page}>
      <div style={styles.sunGlow} />
      <div style={styles.container}>
        <header style={styles.header}>
          <div style={styles.headerLeft}>
            <span style={styles.flagStripe} />
            <h1 style={styles.title}>Che, vamos a estudiar</h1>
          </div>
          <button style={styles.iconBtn} onClick={() => setShowSettings((s) => !s)} aria-label="Einstellungen">⚙</button>
        </header>

        {showSettings && (
          <div style={styles.panel}>
            <div style={styles.panelRow}>
              <span style={styles.panelLabel}>Richtung</span>
              <button style={styles.directionBtn} onClick={() => setDirection((d) => (d === "ar2de" ? "de2ar" : "ar2de"))}>
                <span style={direction === "ar2de" ? styles.dirActive : styles.dirInactive}>🇦🇷 Español</span>
                <span style={{color:"#8B7355"}}>⇄</span>
                <span style={direction === "de2ar" ? styles.dirActive : styles.dirInactive}>Deutsch</span>
              </button>
            </div>

            <div style={styles.panelRow}>
              <span style={styles.panelLabel}>Wortart</span>
              <div style={styles.chipRow}>
                {WORTARTEN.map((art) => {
                  const active = selectedArten.has(art);
                  const count = RAW_VOCAB.filter((v) => v.art === art).length;
                  return (
                    <button key={art} onClick={() => toggleArt(art)}
                      style={{...styles.chip, borderColor: active ? ART_COLORS[art] : "#DDD6C7", background: active ? ART_COLORS[art] + "1A" : "transparent", color: active ? ART_COLORS[art] : "#9B9384"}}>
                      {art} <span style={styles.chipCount}>{count}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={styles.panelRow}>
              <span style={styles.panelLabel}>Reihenfolge</span>
              <label style={styles.toggleWrap}>
                <input type="checkbox" checked={randomized} onChange={(e) => setRandomized(e.target.checked)} style={styles.checkbox} />
                🔀 zufällig mischen
              </label>
            </div>

            <div style={styles.panelFooter}>
              <span style={styles.countLabel}>{filteredBase.length} {filteredBase.length === 1 ? "Vokabel" : "Vokabeln"} ausgewählt</span>
              <button style={styles.startBtn} onClick={startSession} disabled={filteredBase.length === 0}>
                {sessionStarted ? "Neu starten" : "Los geht's"}
              </button>
            </div>
          </div>
        )}

        {!showSettings && sessionStarted && current && (
          <div style={styles.gameArea}>
            <div style={styles.progressBarTrack}>
              <div style={{...styles.progressBarFill, width: `${progress}%`}} />
            </div>
            <div style={styles.statsRow}>
              <span style={styles.statText}>{knownCount} / {totalCards} gekonnt</span>
              <span style={styles.statText}>
                <span style={{color:"#8B7355"}}>noch {queue.length} in der Runde</span>
                {wrongAttempts > 0 && <span style={{color:"#C4472A"}}>{"  "}✕ {wrongAttempts}</span>}
              </span>
              <button style={styles.iconBtnSmall} onClick={restart} aria-label="Neu starten">↺</button>
            </div>

            <div style={styles.cardWrap} onClick={() => !isAnimating && setFlipped((f) => !f)}>
              <div style={{...styles.card, transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)"}}>
                <div style={{...styles.cardFace, ...styles.cardFront}}>
                  <span style={{...styles.artBadge, background: ART_COLORS[current.art] + "1A", color: ART_COLORS[current.art]}}>
                    {current.art}{current.irr ? " · unregelmäßig" : ""}
                  </span>
                  <p style={styles.cardWord}>{front}</p>
                  <span style={styles.tapHint}>tippen zum umdrehen</span>
                </div>
                <div style={{...styles.cardFace, ...styles.cardBack}}>
                  <span style={{...styles.artBadge, background: "rgba(255,255,255,0.18)", color: "#FBF6EA"}}>{current.art}</span>
                  <p style={{...styles.cardWord, color: "#FBF6EA"}}>{back}</p>
                  {current.ex && (
                    <p style={styles.example}>
                      {current.ex.split("\n").map((line, i) => <span key={i} style={{display:"block"}}>{line}</span>)}
                    </p>
                  )}
                </div>
              </div>
            </div>

            <div style={styles.navRow}>
              <button style={{...styles.judgeBtn, ...styles.judgeNo}} onClick={() => markKnown(false)} disabled={isAnimating}>✕ weiß ich nicht</button>
              <button style={{...styles.judgeBtn, ...styles.judgeYes}} onClick={() => markKnown(true)} disabled={isAnimating}>✓ weiß ich</button>
              <button style={styles.navBtn} onClick={skip} disabled={isAnimating} aria-label="Überspringen">›</button>
            </div>
          </div>
        )}

        {!showSettings && roundComplete && (
          <div style={styles.gameArea}>
            <div style={styles.doneBanner}>
              🎉 Alle {totalCards} Vokabeln gekonnt!
              {wrongAttempts > 0 && ` (${wrongAttempts} Versuche gebraucht)`}
              <br />
              <button style={styles.inlineLink} onClick={restart}>nochmal von vorn</button>
              {" oder "}
              <button style={styles.inlineLink} onClick={() => setShowSettings(true)}>Einstellungen ändern</button>
            </div>
          </div>
        )}

        {!sessionStarted && !showSettings && <p style={styles.emptyHint}>Öffne die Einstellungen, um zu starten.</p>}
      </div>
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", background: "#F7F2E4", fontFamily: "'Georgia','Iowan Old Style',serif", position: "relative", overflow: "hidden", display: "flex", justifyContent: "center", padding: "24px 16px 40px", boxSizing: "border-box" },
  sunGlow: { position: "absolute", top: -120, left: "50%", transform: "translateX(-50%)", width: 480, height: 480, borderRadius: "50%", background: "radial-gradient(circle, rgba(212,160,23,0.25) 0%, rgba(212,160,23,0) 70%)", pointerEvents: "none" },

  panel: { background: "#FFFDF8", border: "1px solid #EAE2CE", borderRadius: 16, padding: "18px 18px 16px", boxShadow: "0 1px 3px rgba(43,33,24,0.05)", fontFamily: "'Helvetica Neue',Arial,sans-serif" },

  card: { position: "relative", width: "100%", height: "100%", transformStyle: "preserve-3d", transition: "transform 0.45s cubic-bezier(0.4,0.2,0.2,1)" },

  cardFront: { background: "#FFFDF8", border: "1px solid #EAE2CE", boxShadow: "0 2px 10px rgba(43,33,24,0.06)" },
  cardBack: { background: "linear-gradient(155deg, #2E6E8E 0%, #24506A 100%)", transform: "rotateY(180deg)", boxShadow: "0 2px 14px rgba(30,60,80,0.25)" },
  artBadge: { fontFamily: "'Helvetica Neue',Arial,sans-serif", fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", padding: "4px 10px", borderRadius: 20, marginBottom: 18 },
